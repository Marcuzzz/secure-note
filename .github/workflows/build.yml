name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Decode release keystore (if provided)
        id: keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug + release APKs
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SecureNote-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/SecureNote-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "Release APK is unsigned; skipping."
          fi
          ls -la dist

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureNote-debug-apk
          path: dist/SecureNote-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureNote-release-apk
          path: dist/SecureNote-release.apk
          if-no-files-found: warn

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp deploy/index.html _site/
          if [ -f dist/SecureNote-release.apk ]; then
            cp dist/SecureNote-release.apk _site/
          fi
          if [ -f dist/SecureNote-debug.apk ]; then
            cp dist/SecureNote-debug.apk _site/
          fi
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SecureNote-debug.apk
            dist/SecureNote-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: 'true'

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
